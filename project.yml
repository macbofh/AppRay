name: AppRay

options:
  bundleIdPrefix: com.secrid
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Ad-hoc signing so the project builds on any machine without a team.
    # Switch to your own team in Xcode > Signing & Capabilities to notarize.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES

targets:
  AppRay:
    type: application
    platform: macOS
    sources:
      - path: Sources/AppRay
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macbofh.AppRay
        PRODUCT_NAME: AppRay
        PRODUCT_MODULE_NAME: AppRay
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Resources/AppRay.entitlements
        # Deliberately NOT sandboxed: the app shells out to spctl/stapler and
        # reads arbitrary application bundles anywhere on disk.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES

  AppRayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppRayTests
    dependencies:
      - target: AppRay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macbofh.AppRayTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  AppRay:
    build:
      targets:
        AppRay: all
        AppRayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AppRayTests
